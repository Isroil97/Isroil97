    <stop offset="0" stop-color="#16161e"/><stop offset=".55" stop-color="#1a1b26"/><stop offset="1" stop-color="#24283b"/>
  </linearGradient>
  <radialGradient id="o1"><stop offset="0" stop-color="#7aa2f7" stop-opacity=".55"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
  <radialGradient id="o2"><stop offset="0" stop-color="#bb9af7" stop-opacity=".5"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
  <radialGradient id="o3"><stop offset="0" stop-color="#7dcfff" stop-opacity=".25"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/></radialGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7aa2f7"/><stop offset=".5" stop-color="#bb9af7"/><stop offset="1" stop-color="#7dcfff"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7aa2f7"/><stop offset=".5" stop-color="#bb9af7"/><stop offset="1" stop-color="#7aa2f7"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#a9b1d6" opacity=".10"/></pattern>
  <clipPath id="clip"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
  .o1 { animation: d1 9s ease-in-out infinite alternate; }
  .o2 { animation: d2 11s ease-in-out infinite alternate; }
  .w1 { animation: flow 13s linear infinite; }
  .w2 { animation: flow 8s linear infinite reverse; }
  .tw { animation: tw 3.2s ease-in-out infinite; }
  .fl { animation: fl 6s ease-in-out infinite alternate; }
  .in { animation: in 1.1s cubic-bezier(.2,.7,.3,1) backwards; }
  @keyframes d1 { to { transform: translate(70px, 18px); } }
  @keyframes d2 { to { transform: translate(-80px, 14px); } }
  @keyframes flow { to { transform: translateX(-600px); } }
  @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
  @keyframes fl { to { transform: translateY(-10px); } }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
</style>
